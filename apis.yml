description: Naluri is a digital health and corporate wellness platform operating across
  Southeast Asia. It delivers Employee Assistance Programmes, chronic disease management
  (mental health, obesity, diabetes, hypertension, and cholesterol), health coaching
  and consultations, performance workshops, and Mental Health First Aid training for
  employers, insurers, and individuals. The company reports serving over one million
  members and 200-plus companies, and states it is certified for HIPAA, GDPR, and
  ISO/IEC 27001. No public developer portal, API documentation, or API surface is
  published as of this enrichment pass.
